<form
    fsForm
    [submit]="submitted"
    [dirtySubmitButton]="false"
    [confirm]="false">
  <fs-dialog *fsSkeletonForm="contentLayout()">
    <h1 mat-dialog-title>
      <div class="title-container">
        <div class="title">
          Layout Editor
          <div class="small">
            {{ contentLayout().name }}
          </div>
        </div>
        <div class="toggles">
          <app-editor-toggles
            [editors]="editors()"
            (toggleChange)="editorToggleChange($event)">
          </app-editor-toggles>
        </div>
        <app-editor-actions
          [saveDisabled]="!editor()?.hasChanges() || editor()?.saving()"
          [isMac]="isMac"
          (settings)="openSettings()"
          (save)="save()"
          (done)="close()">
        </app-editor-actions>
      </div>
    </h1>
    <div mat-dialog-content>
      <app-editor
        [contentConfig]="config"
        [showHtml]="editors().html"
        [showScss]="editors().scss"
        [showGlobalScss]="editors().globalScss"
        [html]="contentLayout().content"
        [scss]="contentLayout().styles">
      </app-editor>
    </div>
  </fs-dialog>
</form>
